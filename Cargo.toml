[workspace]
members = ["crates/core", "crates/cli", "crates/starter"]
default-members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
nalgebra = { version = "0.35", default-features = false, features = ["std", "serde-serialize"] }
clap = { version = "4", features = ["derive"] }
prost = "0.14"
rayon = "1.11"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
