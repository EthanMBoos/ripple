[workspace]
members = ["crates/core", "crates/cli", "crates/starter", "crates/delivery", "crates/ardupilot", "crates/python"]
default-members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The oldest toolchain that builds this (clippy checks it); with this, an
# older one says so plainly instead of failing on a newer method.
rust-version = "1.88"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
nalgebra = { version = "0.35", default-features = false, features = ["std", "serde-serialize"] }
clap = { version = "4", features = ["derive"] }
prost = "0.14"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
