[book]
title = "Ripple"
description = "A Rust multi-agent robotics simulator for research and teaching."
language = "en"
src = "src"

[output.html]
site-url = "/ripple/"
git-repository-url = "https://github.com/EthanMBoos/ripple"
edit-url-template = "https://github.com/EthanMBoos/ripple/edit/main/book/{path}"
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = ["theme/custom.css"]
smart-punctuation = true

[output.html.fold]
enable = true
level = 1
