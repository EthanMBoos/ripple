# ArduPilot SITL adapter: an optional user crate, outside the default build.
# The `ripple` command includes it only with `--features ardupilot`
# (crates/cli). User guide: book/src/guides/ardupilot.md.
[package]
name = "ardupilot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ripple-core = { path = "../core" }
anyhow.workspace = true
# Stops the SITL containers when a run is interrupted.
ctrlc = "3"
nalgebra.workspace = true
serde.workspace = true
serde_json.workspace = true
