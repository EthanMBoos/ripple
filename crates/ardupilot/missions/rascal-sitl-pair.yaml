# Two Rascals, each flown by its own ArduPlane SITL, in lockstep: the
# multi-vehicle case. Same as rascal-sitl.yaml otherwise, which explains the
# aircraft, the air start, and wind. Run with --workers 2 so the two SITL waits
# overlap; with one worker they take turns.
format_version: 1
name: Rascal SITL pair

run:
  end_s: 60
  dt_s: 0.0025
  seed: 1

networks:
  LocalNetwork:
  GlobalNetwork:
metrics:
  SimpleCollisionMetrics:

templates:
  rascal:
    visual_model: sphere
    autonomy:
      ArduPilotBridge:
        port: 9002
        frame_timeout: 10
        first_frame_timeout: 60
        # SITL session settings: the mode to arm in, an AUTO route (optionally
        # starting with a takeoff and ending with a landing), or a GUIDED
        # target, each point in metres [east, north, up] from the start. The
        # mode defaults to AUTO with waypoints, GUIDED with goto, else LOITER.
        mode: null
        waypoints: []
        takeoff_altitude: null
        land: false
        goto: null
        speedup: 100
    sensors:
      SitlState:
        wind_E: 0
        wind_N: 0
    motion_model:
      FixedWing6DOF:
        use_launcher: true
        launch_time: 40
        launch_speed: 20
        launch_accel: 20
        wind_E: 0
        wind_N: 0
        gravity_magnitude: 9.81
        air_density: 1.2250
        inertia_matrix_slug_ft_sq: "[ 1.95 0.0 0.0 ] [ 0.0 1.55 0.0 ] [ 0.0 0.0 1.91 ]"
        thrust_min: 0.0
        thrust_max: 25.0
        delta_elevator_min: -0.30
        delta_elevator_max: 0.30
        delta_aileron_min: -0.35
        delta_aileron_max: 0.35
        delta_rudder_min: -0.35
        delta_rudder_max: 0.35
        mass: 5.91
        wing_span: 2.70
        surface_area_of_wing: 0.982
        chord_length: 0.351
        C_D0: 0.028
        C_D_alpha: 0.0
        C_L0: 0.25
        C_L_alpha: 5
        C_LQ: 0.0
        C_L_alpha_dot: 0.0
        C_L_delta_elevator: 0.2
        C_Y_beta: -1.0
        C_Y_delta_rudder: 0.0
        C_L_beta: -0.1
        C_LP: -0.4
        C_LR: 0.15
        C_L_delta_aileron: 0.13
        C_L_delta_rudder: 0.01
        C_M0: 0.0
        C_MQ: -12.0
        C_M_alpha: -0.5
        C_M_alpha_dot: -7.0
        C_M_delta_elevator: -0.5
        C_N_beta: 0.12
        C_NP: 0.0
        C_NR: -0.15
        C_N_delta_aileron: -0.03
        C_N_delta_rudder: -0.05

entities:
  rascal_a:
    template: rascal
    team: 1
    position_m: [0, 0, 200]
    velocity_mps: [0, 0, 0]
    heading_deg: 0
  rascal_b:
    template: rascal
    team: 2
    position_m: [0, 300, 200]
    velocity_mps: [0, 0, 0]
    heading_deg: 0
    autonomy:
      ArduPilotBridge:
        port: 9012
        frame_timeout: 10
        first_frame_timeout: 60
        mode: null
        waypoints: []
        takeoff_altitude: null
        land: false
        goto: null
        speedup: 100
