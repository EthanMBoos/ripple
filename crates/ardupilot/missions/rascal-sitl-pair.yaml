# Two Rascals, each flown by its own ArduPlane SITL, in lockstep: the
# multi-vehicle case. Same as rascal-sitl.yaml otherwise, which explains the
# aircraft, the air start, and wind. Run with --workers 2 so the two SITL waits
# overlap; with one worker they take turns.
format_version: 1
name: Rascal SITL pair

run:
  end_s: 60
  dt_s: 0.0025
  seed: 1

networks:
  LocalNetwork:
  GlobalNetwork:
metrics:
  SimpleCollisionMetrics:

templates:
  rascal:
    visual_model: sphere
    autonomy:
      ArduPilotBridge:
        port: 9002
        frame_timeout: 10
        first_frame_timeout: 60
        # SITL session settings: the mode to arm in, an AUTO route (optionally
        # starting with a takeoff and ending with a landing), or a GUIDED
        # target, each point in metres [east, north, up] from the start. The
        # mode defaults to AUTO with waypoints, GUIDED with goto, else LOITER.
        mode: null
        waypoints: []
        takeoff_altitude: null
        land: false
        goto: null
        speedup: 100
    sensors:
      SitlState:
        wind_E: 0
        wind_N: 0
    motion_model:
      FixedWing6DOF:
        # The Rascal 110: ArduPilot's JSBSim Rascal (see airframe.rs).
        airframe: rascal
        use_launcher: true
        launch_time: 40
        launch_speed: 20
        launch_accel: 20
        wind_E: 0
        wind_N: 0

entities:
  rascal_a:
    template: rascal
    team: 1
    position_m: [0, 0, 200]
    velocity_mps: [0, 0, 0]
    heading_deg: 0
  rascal_b:
    template: rascal
    team: 2
    position_m: [0, 300, 200]
    velocity_mps: [0, 0, 0]
    heading_deg: 0
    autonomy:
      ArduPilotBridge:
        port: 9012
        frame_timeout: 10
        first_frame_timeout: 60
        mode: null
        waypoints: []
        takeoff_altitude: null
        land: false
        goto: null
        speedup: 100
