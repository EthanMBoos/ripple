# One Rascal flown by ArduPlane SITL over the JSON backend. `ripple run`
# (built with --features ardupilot) starts the SITL container and stops it when
# the run ends; see book/src/guides/ardupilot.md.
#
# Aircraft: missions/fixed-wing-6dof-rascal.xml's C++ Rascal parameters, but
# with C++'s original radian surface limits (elevator +-0.30, aileron and rudder
# +-0.35, from before commit 2cab6d119), matching ArduPilotBridge's default PWM
# maps. No controller: the bridge writes the motion inputs. dt 0.0025 s (400 Hz)
# is a whole multiple of ArduPlane's 50 Hz loop.
#
# Air start from rest: FixedWing6DOF's launcher zeroes every force until
# launch_time, so the aircraft hangs still in the air while ArduPlane boots,
# aligns, and arms; then it is catapulted to launch_speed and flies freely. It
# must be still at boot: ArduPlane zeroes its airspeed sensor then, so a hold
# moving at 20 m/s left it reading 20 m/s low. A free start crashes, since
# ArduPlane cannot arm while maneuvering and steers the surfaces even disarmed.
#
# Wind: set wind_E and wind_N (m/s) on both the sensor and the motion model.
# FixedWing6DOF adds wind to velocity, so wind_E 5 on an eastbound aircraft is
# a headwind.
format_version: 1
name: Rascal SITL

run:
  end_s: 60
  dt_s: 0.0025
  seed: 1

networks:
  LocalNetwork:
  GlobalNetwork:
metrics:
  SimpleCollisionMetrics:

templates:
  rascal:
    visual_model: sphere
    autonomy:
      ArduPilotBridge:
        port: 9002
        frame_timeout: 10
        first_frame_timeout: 60
        # SITL session settings: the mode to arm in, an AUTO route (optionally
        # starting with a takeoff and ending with a landing), or a GUIDED
        # target, each point in metres [east, north, up] from the start. The
        # mode defaults to AUTO with waypoints, GUIDED with goto, else LOITER.
        mode: null
        waypoints: []
        takeoff_altitude: null
        land: false
        goto: null
        speedup: 100
    sensors:
      SitlState:
        wind_E: 0
        wind_N: 0
    motion_model:
      FixedWing6DOF:
        use_launcher: true
        launch_time: 40
        launch_speed: 20
        launch_accel: 20
        wind_E: 0
        wind_N: 0
        gravity_magnitude: 9.81
        air_density: 1.2250
        inertia_matrix_slug_ft_sq: "[ 1.95 0.0 0.0 ] [ 0.0 1.55 0.0 ] [ 0.0 0.0 1.91 ]"
        thrust_min: 0.0
        thrust_max: 25.0
        delta_elevator_min: -0.30
        delta_elevator_max: 0.30
        delta_aileron_min: -0.35
        delta_aileron_max: 0.35
        delta_rudder_min: -0.35
        delta_rudder_max: 0.35
        mass: 5.91
        wing_span: 2.70
        surface_area_of_wing: 0.982
        chord_length: 0.351
        C_D0: 0.028
        C_D_alpha: 0.0
        C_L0: 0.25
        C_L_alpha: 5
        C_LQ: 0.0
        C_L_alpha_dot: 0.0
        C_L_delta_elevator: 0.2
        C_Y_beta: -1.0
        C_Y_delta_rudder: 0.0
        C_L_beta: -0.1
        C_LP: -0.4
        C_LR: 0.15
        C_L_delta_aileron: 0.13
        C_L_delta_rudder: 0.01
        C_M0: 0.0
        C_MQ: -12.0
        C_M_alpha: -0.5
        C_M_alpha_dot: -7.0
        C_M_delta_elevator: -0.5
        C_N_beta: 0.12
        C_NP: 0.0
        C_NR: -0.15
        C_N_delta_aileron: -0.03
        C_N_delta_rudder: -0.05

entities:
  rascal:
    template: rascal
    team: 1
    position_m: [0, 0, 200]
    velocity_mps: [0, 0, 0]
    heading_deg: 0
