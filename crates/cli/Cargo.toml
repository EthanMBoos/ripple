[package]
name = "ripple"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The library is the command-line interface; src/main.rs builds the plugin
# registry (stock plugins plus the user crates below) and calls it.
[lib]
name = "ripple_cli"
path = "src/lib.rs"

[[bin]]
name = "ripple"
path = "src/main.rs"

[dependencies]
ripple-core = { path = "../core" }
# User plugin crates compiled into `ripple`; each is registered in src/main.rs.
starter = { path = "../starter" }
delivery = { path = "../delivery" }
# Optional ArduPilot SITL adapter, outside the default build: `--features ardupilot`.
ardupilot = { path = "../ardupilot", optional = true }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
# Reads a terrain's aerial image for the viewer; already a dependency of rerun.
png = "0.18"
tempfile = "3"
rerun = { version = "=0.36.2", default-features = false, features = ["sdk"] }

[features]
ardupilot = ["dep:ardupilot"]
