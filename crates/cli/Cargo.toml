[package]
name = "scrimmage-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

# The library is the command-line interface; src/main.rs builds the plugin
# registry (stock plugins plus the user crates below) and calls it.
[lib]
name = "scrimmage_cli"
path = "src/lib.rs"

[[bin]]
name = "scrimmage"
path = "src/main.rs"

[dependencies]
scrimmage-core = { path = "../core" }
# User plugin crates compiled into `scrimmage`; each is registered in src/main.rs.
starter = { path = "../starter" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
rerun = { version = "=0.36.2", default-features = false, features = ["sdk"] }

[dev-dependencies]
tempfile = "3"
