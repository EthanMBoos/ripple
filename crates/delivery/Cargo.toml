# One day of blood delivery across a region: a classical dispatcher, couriers
# flying skills, and a language-model fleet manager above them. The stock
# `ripple` command registers this crate's plugins (crates/cli/src/main.rs);
# see README.md and docs/FLEET_MANAGER_PLAN.md.
[package]
name = "delivery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ripple-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2 = "0.10"
# The API clients; already compiled through rerun, so nothing new.
ureq = { version = "3", features = ["json"] }

[lints]
workspace = true
