# The 6-DOF check: the no-fly rule in both wordings, and no instruction, with
# the fixed-wing aircraft on the 6-DOF model and its autopilot
# (delivery-6dof.yaml) instead of SimpleAircraft. Compare with the same
# conditions in directives-test: do breaches and on-time share depend on the
# vehicle model? 6 combinations x 5 seeds = 30 runs, about 500 model calls.
name: directives-6dof
base_scenario: delivery-6dof.yaml
seeds: [4, 5, 6, 7, 8]
parameter_combinations: zip
parameters:
  run.end_s: [1800, 1800, 1800, 1800, 1800, 1800]
  entities.depot.autonomy.Dispatcher.directive.kind: [none, no_fly, no_fly, none, no_fly, no_fly]
  entities.depot.autonomy.Dispatcher.directive.phrasing: [0, 0, 3, 0, 0, 3]
  entities.depot.autonomy.Dispatcher.sample: [0, 0, 0, 1, 1, 1]
  entities.depot.autonomy.Dispatcher.skills: [[drop, land], [drop, land], [drop, land], [drop, land], [drop, land], [drop, land]]
  entities.depot.autonomy.Dispatcher.enforce_instruction: [false, false, false, false, false, false]
  entities.depot.autonomy.Dispatcher.limits_in_prompt: [true, true, true, true, true, true]
