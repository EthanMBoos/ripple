# Test run on new missions (seeds 4-8; seeds 1-3 were used for building and
# debugging). Missions end at minute 30, since instructions run from minute 5
# to 25. Closures are left out (never broken). Wording A (0, written first)
# against wording B (the one broken most in development: no-fly 3, grounding
# 2, standby 2). Conditions: direct, two samples, with a no-instruction run;
# drop_via offered, for the no-fly rule; enforced (breaking calls refused in
# code), one sample; and no instruction with the vehicles' limits left out of
# the prompt, two samples. 28 combinations x 5 seeds = 140 runs, about 2,300
# model calls. Summarize with directives.py and deadlines.py.
name: directives-test
base_scenario: delivery.yaml
seeds: [4, 5, 6, 7, 8]
parameter_combinations: zip
