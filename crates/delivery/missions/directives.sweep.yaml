# Does the model follow instructions it was never programmed for? Three
# episodes, each run by Claude Haiku 5.5 with no instruction and with each of
# four instructions (a clinic closure, a no-fly zone, a multirotor on
# standby, a grounded vehicle) in its first three wordings: 39 cases. Bars, set before
# running, are in crates/delivery/directives.py.
name: directives
base_scenario: delivery.yaml
seeds: [1, 2, 3]
prefix: entities.depot.autonomy.Dispatcher
columns: [directive.kind, directive.wording]
cases:
  - [none, plain]
  - [closure, plain]
  - [closure, fire_drill]
  - [closure, hold]
  - [no_fly, plain]
  - [no_fly, sports_day]
  - [no_fly, police]
  - [reserve_multirotor, plain]
  - [reserve_multirotor, emergency_transfer]
  - [reserve_multirotor, last_multirotor]
  - [ground_vehicle, plain]
  - [ground_vehicle, parachute]
  - [ground_vehicle, on_the_ground]
