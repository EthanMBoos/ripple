# Do the models hold the feasible rule's level with sixteen incidents at
# once? Haiku and Opus as the help manager with the compact report, local
# rules below, feedback on, over the incident laid over the sixteen blocks
# of a 256-hub region, on the gate's grid and its two displaced layouts
# (layout seeds 101 and 102) with demand seeds 11 to 15; the fixed rules on
# these days are in incident-gate-256. Live calls through the signed-in
# claude client.
name: incident-models-256
base_scenario: incident.yaml
seeds: [11, 12, 13, 14, 15]
parameters:
  entities.region.autonomy.Dispatcher.manager.offline: false
  entities.region.autonomy.Dispatcher.region.hubs: 256
  entities.region.autonomy.Dispatcher.manager.top_kind: model
  entities.region.autonomy.Dispatcher.manager.top_report: compact
  entities.region.autonomy.Dispatcher.manager.feedback: true
prefix: entities.region.autonomy.Dispatcher
columns: [manager.top_model, region.layout.seed]
cases:
  # grid
  - [claude-haiku-5-5, 0]
  - [claude-opus-5-5, 0]
  # layout 101
  - [claude-haiku-5-5, 101]
  - [claude-opus-5-5, 101]
  # layout 102
  - [claude-haiku-5-5, 102]
  - [claude-opus-5-5, 102]
