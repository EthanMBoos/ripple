# The Return policy on a 1024-hub day, three seeds; no model calls. Completes
# the six-policy table that region-1024-classical.sweep.yaml started, on the
# same mission default day (requests for eight hours, half an hour to finish).
name: region-1024-return
base_scenario: region.yaml
seeds: [1, 2, 3]
parameters:
  entities.region.autonomy.Dispatcher.region.hubs: 1024
  entities.region.autonomy.Dispatcher.manager.offline: true
prefix: entities.region.autonomy.Dispatcher
columns: [manager.kind, manager.policy]
cases:
  - [policy, crates/delivery/policies/return.yaml]
