# One day of blood delivery across a region of hubs on SimpleAircraft and
# point multirotors. The Dispatcher on the region entity places the hubs,
# builds each hub's couriers from the two recipes, and holds the stock,
# requests, events and the fleet manager; see crates/delivery/README.md. The
# region's size is one value:
#
#   ripple run crates/delivery/missions/region.yaml --headless \
#     entities.region.autonomy.Dispatcher.region.hubs:=256
format_version: 1
name: region

run:
  end_s: 30600
  dt_s: 0.1
  seed: 1

networks: {GlobalNetwork: {}}
metrics: {DeliveryScore: {}}

recipes:
  # Built only when a plugin asks: the Dispatcher's fleet, below, asks for
  # each hub's couriers at the hub and gives each its hub and the region.
  fixed_wing:
    team: 1
    visual_model: aircraft
    position_stddev_m: [60, 60, 0]
    heading_deg: 90
    velocity_mps: [0, 25, 0]
    autonomy:
      Courier:
        class: fixed_wing
        cruise_speed_mps: 25
        endurance_s: 3600
        cruise_altitude_m: 120
        # Idle aircraft count as recovered on the ground, so their loiter
        # (drawn because SimpleAircraft can't stop) stays inside the hub
        # radius, where flight uses no endurance.
        hub_radius_m: 400
        arrival_radius_m: 75
        loiter_radius_m: 300
    controller: {SimpleAircraftControllerPID: {}}
    motion_model: {SimpleAircraft: {}}
  multirotor:
    team: 1
    visual_model: sphere
    position_stddev_m: [3, 3, 0]
    autonomy:
      Courier:
        class: multirotor
        cruise_speed_mps: 12
        endurance_s: 1500
        cruise_altitude_m: 80
        hub_radius_m: 200
        arrival_radius_m: 3
        dwell_s: 30
    controller: {SingleIntegratorControllerSimple: {}}
    motion_model: {SingleIntegrator: {max_speed_mps: 12}}

entities:
  region:
    team: 1
    visual_model: sphere
    position_m: [0, 0, 0]
    autonomy:
      Dispatcher:
        region:
          # A square number of hubs on a grid; hub_positions_m, one [east,
          # north] per hub, displaces them (region.py --policy-sweeps).
          hubs: 16
          hub_spacing_m: 15000
          hub_positions_m: []
        # The couriers built at every hub, from the recipes above.
        fleet:
          - {recipe: fixed_wing, per_hub: 3, altitude_m: 120}
          - {recipe: multirotor, per_hub: 2}
        stock:
          items: ["O-", "O+", "A+", "B+"]
          units_per_item: 100
          restock_interval_s: 3600
          restock_units: 30
          package_units: 4
        requests:
          per_hub_per_hour: 12
          # The day: requests open until then; the run ends 30 min later.
          until_s: 28800
          urgent_share: 0.3
          trauma_share: 0.1
          routine_deadline_s: 7200
          urgent_deadline_s: 1800
          trauma_deadline_s: 900
        events:
          # Expected events of each kind per hub per 8-hour day, scaled to the
          # day's length; the count is drawn from the seed, so a larger region
          # faces more events.
          per_hub_per_day:
            surge: 0.25
            shortage: 0.25
            closure: 0.25
            outage: 0.1
            weather: 0.5
            priority: 0.5
            rooftop_closed: 0.5
            corridor: 0.5
          # A fixed list instead, when not empty: for example
          # [{kind: surge, at_min: 30, hubs: [1, 2]}].
          scripted: []
          surge_requests_per_hub: 16
          surge_window_min: 15
          closure_radius_km: 6
          corridor_length_km: 10
          corridor_half_width_km: 0.5
          # One text per kind, written once. {hubs}, {site}, {item},
          # {area}, {class}, {from} and {to} are filled in.
          text:
            surge: >-
              A mass-casualty incident near {hubs}: the hospitals there are sending trauma requests beyond what those hubs can fly alone, starting at minute {from}.
            shortage: >-
              {item} has run out at {hubs} as of minute {from}. Requests for {item} at their sites can only be served from hubs that still hold it.
            closure: >-
              Airspace is closed in {area} from minute {from} until minute {to}; no flights through it.
            outage: >-
              {hubs} cannot launch from minute {from} until minute {to}; its sites must be covered by other hubs.
            weather: >-
              Weather at {hubs}: no {class} launches from minute {from} until minute {to}.
            priority: >-
              Hospital {site} takes priority over routine deliveries from minute {from} until {to}.
            rooftop_closed: >-
              The rooftop at hospital {site} is closed from minute {from} until minute {to}; only drops at its ground pad are allowed.
            corridor: >-
              A medevac helicopter corridor is active in {area} from minute {from} until minute {to}; no vehicle may cross it below 150 m.
        manager:
          # none (dispatcher only), scripted, replanner, policy, model, or
          # veto (the replanner plans, the model drops what it objects to).
          kind: none
          check_in_s: 1800
          # The interface: view summaries (one line per hub) or exceptions
          # (only hubs with something wrong); feedback reports each order's
          # estimate and what was flown since; checker refuses orders that
          # break a rule or cannot be flown.
          view: summaries
          feedback: false
          checker: false
          # With feedback: each move's donor hub, its idle vehicles now and
          # its late deliveries since, as one fixed line.
          cost_feedback: false
          # Refuse a reposition leaving the donor under half its vehicles of
          # the class, or a transfer leaving it under a quarter of its stock.
          guard: false
          # A call budget: calls at least 3600 / calls_per_hour s apart, events
          # between calls batched; 0 is a call per event.
          calls_per_hour: 0
          # A fleet manager per square cluster of hubs this many a side; 0 is
          # one over the region.
          cluster_side: 0
          # Hand-written orders for kind scripted: [{at_min: 30, order:
          # {reposition: {class: fixed_wing, count: 4, from_hub: 2, to_hub: 1}}}].
          scripted: []
          # The rules file for kind policy, written by hand or by a model once
          # (src/policy.rs); a path from the working directory.
          policy: ""
          # The help manager, called after the managers above: none,
          # replanner, or model; it sees the help hubs ask for with the hubs
          # that could give it, and grants help, a hub serving an asking
          # hub's sites for a time (src/help.rs), and sees the hub view.
          # top_model empty means model.
          top_kind: none
          top_model: ""
          # Whose model and how it is reached (src/client.rs): provider
          # claude, openai, or ollama; via cli or api. Replies are kept in
          # cache_dir; offline: true uses only replies already there.
          provider: claude
          via: cli
          model: claude-haiku-5-5
          sample: 0
          prompt:
            system: >-
              You are the fleet manager for a regional blood delivery service. The
              dispatcher assigns each request to the idle vehicle at the site's own hub that
              has the stock and the range and arrives soonest; it does not read events.
              Fixed-wing aircraft drop by parachute and cannot land; multirotors can also
              land on hospital rooftops, which take only a landing, and have a short range.
              Each hub holds stock of each blood type. Sites are named by hub number and
              letter: 3A to 3F are hub 3's clinics, 3H1 and 3H2 its hospitals. You never
              assign single requests: you
              give orders that change what the dispatcher may do, where vehicles and stock
              are, and what comes first. Keep trauma and urgent deliveries on time, keep
              flights out of closed areas, and do not send vehicles beyond their endurance.
              Reply with JSON only, no other text.
          cache_dir: runs/llm-cache
          offline: false
          command: null
          host: null
        range_margin: 0.9
        dwell_s: 30
        confirm_timeout_s: 5
        decision_interval_s: 5
        retry_interval_s: 60
        detour_margin_m: 500
    controller: {SingleIntegratorControllerSimple: {}}
    motion_model: {SingleIntegrator: {}}
