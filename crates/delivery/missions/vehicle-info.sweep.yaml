# Small trial: seven conditions, one mission seed and one reply sample.
# No instruction or added system-prompt sentences. Change model below to
# repeat the experiment for another model. This file does not contain results.
name: vehicle-info
base_scenario: delivery.yaml
seeds: [4]
parameters:
  run.end_s: 1800
  entities.depot.autonomy.Dispatcher.provider: openai
  entities.depot.autonomy.Dispatcher.via: cli
  entities.depot.autonomy.Dispatcher.model: gpt-6-luna
  entities.depot.autonomy.Dispatcher.directive.kind: none
  entities.depot.autonomy.Dispatcher.enforce_instruction: false
prefix: entities.depot.autonomy.Dispatcher
repeat:
  sample: [0]
columns: [skills, prompt.additions, prompt.limits, prompt.omit]
cases:
  - [[drop, land], [], true, []]
  - [[drop, land], [], true, [capabilities]]
  - [[drop, land], [], true, [cruise_speed]]
  - [[drop, land], [], true, [endurance]]
  - [[drop, land], [], true, [minimum_speed]]
  - [[drop, land], [], true, [turn_radius]]
  - [[drop, land], [], false, []]
