# The hand-written replanner (src/replanner.rs) in the policy form, rule for
# rule. A run with `manager.kind: policy` and this file gives the same orders
# as `manager.kind: replanner`; tests/region.rs checks it.
- when: surge
  do:
    - reposition: {class: fixed_wing, count: 4}
    - reposition: {class: multirotor, count: 2}
    - serve_from: {hubs: {nearest: 2}}
    - prioritize: {site: null, urgency: trauma}
- when: shortage
  do:
    - transfer: {item: event_item, units: half_stock, from: {nearest_with_stock: 1}}
    - serve_from: {hubs: {nearest_with_stock: 1}}
- when: closure
  do:
    - avoid: {}
- when: corridor
  do:
    - avoid: {}
- when: outage
  do:
    - ground: {hubs: each_hub, class: any}
    - serve_from: {hubs: {nearest: 2}}
- when: weather
  do:
    - ground: {hubs: event_hubs, class: event_class}
- when: priority
  do:
    - prioritize: {site: event_site, urgency: null}
- when: rooftop_closed
  do:
    - use_pad: {}
- when: check_in
  do:
    - top_up: {below: quarter_stock, units: half_stock}
