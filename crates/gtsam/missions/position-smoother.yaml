# The starter's Kalman filter mission with a third robot: a point robot drives
# a 100 m square believing GTSAM's fixed-lag smoother (GtsamSmoother), beside
# one believing the starter's PositionKalman filter and one with perfect
# localization. Both estimators assume the robot moves as commanded; its
# motors only reach 8 m/s although it asks for 10. A position fix arrives
# every 5 s. On this problem the two estimators agree, which
# tests/position_smoother.rs checks.
# Needs `ripple` built with `--features gtsam`: book/src/guides/gtsam.md.
format_version: 1
name: A GTSAM smoother between position fixes

run:
  end_s: 60
  dt_s: 0.1
  seed: 1

networks:
  GlobalNetwork:          # WaypointFollower listens here for route changes

templates:
  robot:
    position_m: [0, 0, 0]
    position_stddev_m: [0, 0, 0]
    visual_model: sphere
    autonomy:
      WaypointFollower:
        waypoints_m: [[100, 0, 0], [100, 100, 0], [0, 100, 0], [0, 0, 0]]
        repeat: true
        arrival_radius_m: 2
        speed_mps: 10
    motion_model:
      SingleIntegrator:
        max_speed_mps: 8      # the hidden truth: its motors only reach 8 m/s

entities:
  smoother:
    template: robot
    team: 1
    sensors:
      gps:
        plugin: NoisyState
        loop_rate_hz: 0.2    # one fix every 5 s
        position_stddev_m: [0, 0, 0]   # exact fixes; raise to add GPS noise
    localization:
      GtsamSmoother:
        speed_gain: 1.0          # assumes it moves as commanded: 2 m/s too fast
        process_noise_m2ps: 1.0  # position variance a tick's motion adds per second
        lag_s: 10                # ticks older than this leave the window

  kalman:
    template: robot
    team: 2
    sensors:
      gps:
        plugin: NoisyState
        loop_rate_hz: 0.2    # one fix every 5 s
        position_stddev_m: [0, 0, 0]   # exact fixes; raise to add GPS noise
    localization:
      PositionKalman:
        speed_gain: 1.0
        process_noise_m2ps: 1.0

  perfect:
    template: robot
    team: 3
