# Reinforcement-learning demos: autonomies whose actions come from a trained
# network (an ONNX file) or, while training, from Python (python/). Outside
# the default build: `ripple` includes it with `--features learning`
# (crates/cli). Book chapters: "Training a single agent", "Training a team".
[package]
name = "learning"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ripple-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
# Runs the trained networks; pure Rust, no ONNX Runtime to install.
tract-onnx = { version = "0.23", default-features = false }
