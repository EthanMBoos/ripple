# Python bindings for training: a Ripple simulation that Python steps, setting
# each agent's action. Built by maturin (pyproject.toml), not by Cargo alone;
# see crates/learning/README.md.
[package]
name = "ripple-learning-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# No Rust tests here: a test binary would need libpython at run time. The
# Python environments exercise this module; crates/learning/tests replays the
# policies.
test = false
doctest = false

[dependencies]
ripple-core = { path = "../../core" }
learning = { path = ".." }
anyhow.workspace = true
# maturin turns on pyo3's extension-module feature (pyproject.toml).
pyo3 = "0.30"
