# User plugins. The stock `scrimmage` command registers this crate's plugins
# (crates/cli/src/main.rs), so its missions run with `scrimmage run` and
# `scrimmage sweep` like any other. To add another crate like this one, see
# book/src/guides/user-plugins.md.
[package]
name = "starter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
scrimmage-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
