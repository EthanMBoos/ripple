# Cluster environment for building ripple on shared storage, so that
# `ripple sweep --slurm` has a binary every compute node can run. Create it
# once: conda env create -f environment.yaml
name: ripple
channels:
  - conda-forge
  - nodefaults
dependencies:
  - rust=1.98.1  # Includes rustc and cargo.
  - c-compiler
  - python=3.11
  - git
