# Beard and McLain's Aerosonde (the built-in `aerosonde` airframe) flown open
# loop for 10 s at its longitudinal trim for level flight at 25 m/s
# in its parameter file's air. reference/aerosonde_check.py solves the trim
# from the book's equations and writes this file (`--update-mission`), then
# flies it and measures the drift in altitude and airspeed. The ailerons and
# rudder hold the propeller's torque and leave a small side force, the lateral
# residual, which drifts the aircraft sideways. Not compared with SCRIMMAGE,
# which has no Aerosonde.
format_version: 1
name: aerosonde

run:
  end_s: 10
  dt_s: 0.01
  seed: 1

entities:
  aerosonde:
    team: 1
    position_m: [0, 0, 100]
    velocity_mps: [25, 0, 0]
    heading_deg: 0
    pitch_deg: -2.8476184662704003
    visual_model: sphere
    controller:
      HeldControls:
        throttle: 0.7735075488777807
        elevator_rad: -0.12391805205152144
        aileron_rad: 0.0059222385102022665
        rudder_rad: -0.0009441249798873178
    motion_model:
      Aerosonde:
        airframe: aerosonde
        air_density_kgpm3: 1.2682
