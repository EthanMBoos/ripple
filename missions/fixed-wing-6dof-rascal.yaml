# FixedWing6DOF as the Rascal 110 RC plane (the built-in `rascal` airframe,
# from ArduPilot's JSBSim Rascal): the airframe planned for ArduPlane SITL.
#
# Known limits: no stall behavior, so keep to moderate-angle flight around
# 20 m/s; thrust_max 25 N has no source in the JSBSim model. See
# book/src/guides/ardupilot.md.
#
# Aircraft: PID from a level start, PID recovering from a roll/pitch upset, and
# a hands-off glide (all gains zero, so zero throttle and neutral surfaces).
# The PID aircraft keep attitude limits of 45 and 60 degrees, wider than the
# Rascal profile's 20 and 45.
format_version: 1
name: fixed-wing-6dof-rascal

run:
  end_s: 60
  dt_s: 0.01
  seed: 12345

networks: {LocalNetwork: {}, GlobalNetwork: {}}
metrics: {SimpleCollisionMetrics: {}}

templates:
  rascal:
    visual_model: sphere
    velocity_mps: [20, 0, 0]
    heading_deg: 0
    autonomy:
      Straight:
        speed: 20
    controller:
      AircraftPIDController:
        airframe: rascal
        max_pitch: 45
        max_roll: 60
    motion_model:
      FixedWing6DOF:
        airframe: rascal

entities:
  level:
    template: rascal
    team: 1
    position_m: [0, 0, 200]
  upset:
    template: rascal
    team: 2
    position_m: [0, 300, 200]
    roll_deg: 60
    pitch_deg: 30
  glide:
    template: rascal
    team: 3
    position_m: [0, 600, 200]
    controller:
      AircraftPIDController:
        airframe: rascal
        heading_pid: [0, 0, 0, 0]
        altitude_pid: [0, 0, 0, 0]
        speed_pid: [0, 0, 0, 0]
        pitch_pid: [0, 0, 0, 0]
        roll_pid: [0, 0, 0, 0]
