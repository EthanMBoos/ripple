# Measured contacts along a shared route. The route follower does not use
# the tracks; `--trace` records them with their covariance and
# `--draw-covariance` draws it. A regression input for the comparison.
format_version: 1
name: noisy-contacts

run:
  end_s: 8
  dt_s: 0.1
  seed: 12345

networks: {LocalNetwork: {}}
metrics: {SimpleCollisionMetrics: {}}

templates:
  point_agent:
    visual_model: sphere
    heading_deg: 0
    autonomy:
      WaypointFollower:
        waypoints_m: [[30, 0, 0], [30, 20, 0]]
        speed_mps: 5
    motion_model: {SingleIntegrator: {}}
    sensors:
      NoisyContacts:
        position_stddev_m: [5, 5, 1]
        velocity_stddev_mps: [5, 5, 1]

entities:
  blue:
    template: point_agent
    team: 1
    position_m: [0, -5, 0]
  red:
    template: point_agent
    team: 2
    position_m: [0, 5, 0]
