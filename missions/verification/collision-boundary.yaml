# SimpleCollision's strict range. Stationary pairs sit exactly at the 5 m
# collision range, along x and as a 3-4-5 triangle in 3D, and must not
# collide. Two pairs start 6.05 m apart and close at 2 m/s, colliding during
# the run: one opposing, one same-team. Startup range stays 2 m.
format_version: 1
name: collision-boundary

run:
  end_s: 2
  dt_s: 0.1
  seed: 3

interactions:
  SimpleCollision:
    collision_range: 5
    startup_collision_range: 2
networks: {GlobalNetwork: {}, LocalNetwork: {}}
metrics: {SimpleCollisionMetrics: {}}

templates:
  point:
    visual_model: sphere
    heading_deg: 0
    autonomy:
      ConstantVelocity:
        velocity: [0, 0, 0]
    controller: {SingleIntegratorControllerSimple: {}}
    motion_model: {SingleIntegrator: {}}

entities:
  along_x_a:
    template: point
    team: 1
    position_m: [0, 0, 50]
  along_x_b:
    template: point
    team: 2
    position_m: [5, 0, 50]
  opposing_still:
    template: point
    team: 1
    position_m: [100, 0, 50]
  opposing_closing:
    template: point
    team: 2
    position_m: [106.05, 0, 50]
    autonomy:
      ConstantVelocity:
        velocity: [-2, 0, 0]
  same_team_still:
    template: point
    team: 1
    position_m: [200, 0, 50]
  same_team_closing:
    template: point
    team: 1
    position_m: [206.05, 0, 50]
    autonomy:
      ConstantVelocity:
        velocity: [-2, 0, 0]
  in_3d_a:
    template: point
    team: 2
    position_m: [300, 0, 50]
  in_3d_b:
    template: point
    team: 1
    position_m: [303, 0, 54]
