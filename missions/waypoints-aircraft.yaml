# Two aircraft follow a looping route; a GlobalNetwork replacement at 12 s
# changes both goals.
format_version: 1
name: waypoints-aircraft

run:
  end_s: 60
  dt_s: 0.1
  seed: 12345

interactions:
  WaypointBroadcast:
    waypoints: [[300, 0, 200], [300, 300, 200], [-300, 300, 200], [-300, -300, 200]]
    update_at_s: 12
    update_waypoints: [[0, -300, 200], [-300, -300, 200], [-300, 300, 200], [300, 300, 200]]
networks: {GlobalNetwork: {}}
metrics: {SimpleCollisionMetrics: {}}

templates:
  aircraft:
    visual_model: sphere
    velocity_mps: [20, 0, 0]
    heading_deg: 0
    autonomy:
      WaypointFollower:
        waypoints: [[300, 0, 200]]
        arrival_radius_m: 40
        speed: 20
        repeat: true
    controller: {SimpleAircraftControllerPID: {}}
    motion_model: {SimpleAircraft: {}}

entities:
  blue:
    template: aircraft
    team: 1
    color: [70, 130, 255]
    position_m: [0, -30, 200]
  red:
    template: aircraft
    team: 2
    color: [255, 100, 70]
    position_m: [0, 30, 200]
