# Open-loop physics checks, not an autopilot demo. MotorSpeeds supplies rad/s.
# 821.5838362577492 rad/s balances the 1.5 kg quad's weight.
# Straight speed 0 is only a placeholder autonomy; MotorSpeeds reads no inputs.
format_version: 1
name: Multirotor open-loop flight

run:
  end_s: 4
  dt_s: 0.001
  seed: 12345

networks: {LocalNetwork: {}, GlobalNetwork: {}}
metrics: {SimpleCollisionMetrics: {}}

templates:
  hovering_quad:
    position_variance_m2: [100, 100, 0]
    visual_model: sphere
    autonomy:
      Straight:
        speed_mps: 0
    controller:
      MotorSpeeds:
        speeds_radps: [821.5838362577492, 821.5838362577492, 821.5838362577492, 821.5838362577492]
    # Illustrative test values, not a real aircraft.
    motion_model:
      Multirotor:
        mass_kg: 1.5
        inertia_kgm2: [[0.0122, 0, 0], [0, 0.0122, 0], [0, 0, 0.0244]]
        body_drag_coefficient: 0.058
        thrust_coefficient: 5.45e-6
        torque_coefficient: 2.284e-7
        min_rotor_speed_radps: 346.41
        max_rotor_speed_radps: 1200
        rotors:
          - {direction: ccw, position_flu_m: [0, -0.175, 0]}
          - {direction: ccw, position_flu_m: [0, 0.175, 0]}
          - {direction: cw, position_flu_m: [0.175, 0, 0]}
          - {direction: cw, position_flu_m: [-0.175, 0, 0]}

entities:
  level_hover:
    template: hovering_quad
    team: 1
    position_m: [-10, -10, 30]

  # Tilted thrust translates the vehicle; no stabilizer levels it.
  tilted:
    template: hovering_quad
    team: 2
    position_m: [10, -10, 30]
    heading_deg: 45
    roll_deg: 5
    pitch_deg: 8

  # Slightly unequal motors exercise roll, pitch, yaw and body/world rates.
  unequal_motors:
    template: hovering_quad
    team: 3
    position_m: [-10, 10, 30]
    heading_deg: 90
    roll_deg: 3
    controller:
      MotorSpeeds:
        speeds_radps: [820, 821, 823, 822]

  # Six rotors demonstrate configured channel names, not a quad-only engine.
  hexacopter:
    template: hovering_quad
    team: 4
    position_m: [10, 10, 30]
    heading_deg: 180
    controller:
      MotorSpeeds:
        speeds_radps: [680, 680, 680, 680, 680, 680]
    motion_model:
      Multirotor:
        mass_kg: 1.5
        inertia_kgm2: [[0.0122, 0, 0], [0, 0.0122, 0], [0, 0, 0.0244]]
        body_drag_coefficient: 0.058
        thrust_coefficient: 5.45e-6
        torque_coefficient: 2.284e-7
        min_rotor_speed_radps: 346.41
        max_rotor_speed_radps: 1200
        rotors:
          - {direction: cw, position_flu_m: [0.2, 0, 0]}
          - {direction: ccw, position_flu_m: [0.1, 0.17320508075688773, 0]}
          - {direction: cw, position_flu_m: [-0.1, 0.17320508075688773, 0]}
          - {direction: ccw, position_flu_m: [-0.2, 0, 0]}
          - {direction: cw, position_flu_m: [-0.1, -0.17320508075688773, 0]}
          - {direction: ccw, position_flu_m: [0.1, -0.17320508075688773, 0]}
