[workspace]

[package]
name = "ripple-receive-proof"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "receive.rs"

[features]
readings = ["dep:ripple-core"]
routing = ["dep:ripple-core", "dep:serde"]

[dependencies]
ripple-core = { path = "../../crates/core", optional = true }
serde = { version = "1", optional = true }
creusot-std = "=0.14.0"
anyhow = "=1.0.104"
serde_json = "1"

[build-dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"

[patch.crates-io]
creusot-std = { path = "../../target/creusot-std-0.14.0" }
